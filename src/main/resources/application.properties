spring.application.name=identity-service
server.port=9000
# Local SQL Server from compose.yaml: start it with the app, leave it running afterwards
spring.docker.compose.lifecycle-management=start-only

# Address written into every token as "iss" (localhost works without an /etc/hosts entry)
spring.security.oauth2.authorizationserver.issuer=http://localhost:9000

spring.security.oauth2.authorizationserver.client.kosaplus-web.registration.client-id=kosaplus-web
spring.security.oauth2.authorizationserver.client.kosaplus-web.registration.client-name=Kosaplus
spring.security.oauth2.authorizationserver.client.kosaplus-web.registration.client-authentication-methods=none
spring.security.oauth2.authorizationserver.client.kosaplus-web.registration.authorization-grant-types=authorization_code
spring.security.oauth2.authorizationserver.client.kosaplus-web.registration.redirect-uris=http://127.0.0.1:3002/callback
spring.security.oauth2.authorizationserver.client.kosaplus-web.registration.scopes=openid,profile,email
spring.security.oauth2.authorizationserver.client.kosaplus-web.require-proof-key=true

spring.security.user.name=admin
spring.security.user.password=password